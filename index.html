<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KPI Tracker</title>
  <meta name="description" content="Laporan harian, KPI karyawan, dan pelacak views YouTube.">
  <meta name="theme-color" content="#5b5bf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // pasang tema sebelum render agar tidak berkedip
    (function () {
      try {
        var t = localStorage.getItem('theme') || 'system';
        if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast-host" aria-live="polite"></div>
  <div id="modal-host"></div>

  <script src="version.js"></script>
  <script src="config.js"></script>
  <script src="js/kpi.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/api.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
